<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F6F3FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1722" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Ziklub — same song, same moment. Listen to music together with your friends, wherever they are." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" />
    <title>Ziklub</title>
    <!-- Netlify injects a "Powered by Netlify" badge on every page. Use its own dismissal setting so it never renders,
         and hide its frame in case storage is unavailable (private browsing). -->
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden');
      } catch (e) {}
    </script>
    <style>
      #nl-badge-frame, #nl-hud-frame { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
